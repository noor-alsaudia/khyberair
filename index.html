<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
// Silence expected Firebase/GSheets sync fetch errors (these are caught by app already)
(function(){
  var origFetch = window.fetch;
  window.fetch = function(url, opts){
    var u = String(url||'');
    if(u.indexOf('firebaseio.com')>-1 || u.indexOf('script.google.com')>-1){
      return origFetch.apply(this, arguments).catch(function(e){
        return new Response(JSON.stringify({error:'offline'}), {status: 503, statusText: 'Service Unavailable', headers: {'Content-Type': 'application/json'}});
      });
    }
    return origFetch.apply(this, arguments);
  };
  window.addEventListener('error', function(e){
    if(e && e.message && e.message.indexOf('Failed to fetch')>-1 && e.filename && (e.filename.indexOf('firebaseio')>-1 || e.filename.indexOf('script.google')>-1)){
      e.preventDefault();
      return false;
    }
  }, true);
  window.addEventListener('unhandledrejection', function(e){
    if(e && e.reason && String(e.reason).indexOf('Failed to fetch')>-1){
      e.preventDefault();
      return false;
    }
  });
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khyber Air Services</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="logo">
      <div class="logo-icon"><i class="bi bi-airplane-fill"></i></div>
      <div class="logo-main">Khyber Air Services</div>
      <div class="logo-sub">Travel & Umrah Management</div>
    </div>
    
    <div class="nav-sec">Navigation</div>
    <div class="nav-item active" onclick="showScreen('dashboard')"><i class="bi bi-speedometer2"></i> Dashboard</div>
    <div class="nav-item" onclick="showScreen('groups')"><i class="bi bi-people-fill"></i> Groups <span class="nbadge blue show" id="badge-groups">0</span></div>
    <div class="nav-item" id="nav-add-pax" onclick="showScreen('pax-edit')"><i class="bi bi-person-plus-fill"></i> Add Passenger</div>
    <div class="nav-item" id="nav-users" onclick="showScreen('users')"><i class="bi bi-shield-lock-fill"></i> Staff Accounts</div>
    
    <div class="sfooter">
      <div class="sfooter-top">
        <div class="avatar" id="user-avatar">--</div>
        <div style="min-width:0; flex:1">
          <div style="font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis" id="user-name">Loading...</div>
          <div style="font-size:10px; color:var(--text3); text-transform:uppercase; font-weight:700" id="user-role">---</div>
        </div>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <button class="menu-btn"><i class="bi bi-list"></i></button>
      <div class="ptitle" id="page-title">Dashboard</div>
    </div>
    
    <div class="content">
      <div class="screen active" id="screen-dashboard">
        <div class="stats">
          <div class="stat s-purple">
            <div class="stat-label">Total Passengers</div>
            <div class="stat-val c-teal" id="stat-pax">0</div>
          </div>
          <div class="stat s-green">
            <div class="stat-label">Active Groups</div>
            <div class="stat-val c-green" id="stat-groups">0</div>
          </div>
        </div>
      </div>

      <div class="screen" id="screen-pax-edit">
        <div class="card">
          <div class="card-hdr">
            <div class="card-title"><i class="bi bi-person-plus"></i> Passenger Details</div>
          </div>
          <div class="grid2">
            <div class="fg"><label class="fl">Passenger Name</label><input type="text" id="pax-name" placeholder="Enter Full Name"></div>
            <div class="fg"><label class="fl">Passport Number</label><input type="text" id="pax-passport" placeholder="Enter Passport No"></div>
          </div>
          <div class="grid3">
            <div class="fg"><label class="fl">Ticket Number</label><input type="text" id="pax-ticket" placeholder="Enter Ticket No"></div>
            <div class="fg"><label class="fl">PNR Status</label><select id="pax-status"><option value="Active">Active</option><option value="Cancelled">Cancelled</option></select></div>
            <div class="fg"><label class="fl">Group Assignment</label><select id="pax-group"><option value="">No Group</option></select></div>
          </div>
          <button class="btn btn-p" id="tb-add-pax" onclick="alert('Passenger saved successfully!')">Save Passenger</button>
        </div>
      </div>

      <div class="screen" id="screen-groups">
        <div class="toolbar">
          <button class="btn btn-p" id="nav-add-grp" onclick="alert('New Group creation prompt')"><i class="bi bi-plus-lg"></i> Create New Group</button>
        </div>
        <div class="ag-grid" id="groups-list">
          <div class="empty-state"><i class="bi bi-folder-x"></i><p>No active groups found.</p></div>
        </div>
      </div>

      <div class="screen" id="screen-users">
        <div class="card">
          <div class="card-title">Staff Access Management</div>
          <div class="divider"></div>
          <div class="user-grid" id="users-list">
            </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
// Navigation helper inside main layout for screen switching
function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  
  const targetScreen = document.getElementById('screen-' + screenId);
  if(targetScreen) targetScreen.classList.add('active');
  
  const pageTitle = document.getElementById('page-title');
  if(pageTitle) pageTitle.innerText = screenId.toUpperCase();
}
</script>
</body>
</html>
